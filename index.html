<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أبو حلاوة | ملك السعادة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green:      #64a93d;   /* logo background green */
    --green-dark: #4a8129;
    --orange:     #db6b2e;   /* flyer panel orange */
    --red:        #e63c31;   /* ribbon red */
    --gold:       #fab750;   /* crown gold */
    --foam:       #fbf8f1;   /* warm pale bg */
    --card:       #ffffff;
    --ink:        #2a2013;
    --ink-mute:   #6b6255;
    --line:       #ece4d6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--foam);
    color: var(--ink);
    font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 1.1rem 3rem;
  }

  a { color: inherit; }

  /* ---------- HERO ---------- */
  .hero {
    position: relative;
    background: linear-gradient(170deg, var(--green) 0%, var(--green-dark) 100%);
    padding: 2.2rem 1.1rem 4.2rem;
    text-align: center;
    overflow: hidden;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.10;
    background-image: radial-gradient(circle, rgba(255,255,255,0.6) 0 3px, transparent 4px);
    background-size: 46px 46px;
  }
  .hero-inner { position: relative; z-index: 1; }

  .logo {
    width: 100%;
    max-width: 260px;
    height: auto;
    display: block;
    margin: 0 auto 0.8rem;
    border-radius: 18px;
    box-shadow: 0 14px 30px rgba(0,0,0,0.28);
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  .tagline {
    color: rgba(255,255,255,0.92);
    font-size: 1.02rem;
    font-family: 'Changa', sans-serif;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.01em;
  }

  .wave {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    line-height: 0;
  }
  .wave svg { width: 100%; height: 42px; display: block; }

  /* ---------- SECTIONS ---------- */
  section { margin-top: 2rem; }

  .section-title {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'Changa', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    color: var(--ink);
    margin: 0 0 0.85rem;
  }
  .section-title svg { width: 20px; height: 20px; flex-shrink: 0; color: var(--red); }

  /* ---------- FACEBOOK BUTTON ---------- */
  .fb-btn {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    background: #1877f2;
    color: #fff;
    text-decoration: none;
    padding: 1rem 1.1rem;
    border-radius: 16px;
    box-shadow: 0 8px 20px rgba(24,119,242,0.28);
  }
  .fb-btn .icon-circle {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.16);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fb-btn .icon-circle svg { width: 21px; height: 21px; }
  .fb-text { flex: 1; text-align: right; }
  .fb-title { font-weight: 800; font-size: 1rem; font-family: 'Changa', sans-serif; }
  .fb-sub { font-size: 0.8rem; opacity: 0.9; margin-top: 0.1rem; }
  .fb-chevron { flex-shrink: 0; opacity: 0.85; }
  .fb-chevron svg { width: 16px; height: 16px; }

  /* ---------- MENU (stacked photos) ---------- */
  .menu-card {
    background: var(--card);
    border-radius: 16px;
    padding: 0.6rem;
    box-shadow: 0 2px 14px rgba(42,32,19,0.08);
  }
  .menu-card + .menu-card { margin-top: 1rem; }

  .menu-link {
    position: relative;
    display: block;
    border-radius: 10px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
    border: none;
    padding: 0;
    width: 100%;
    background: none;
  }
  .menu-img {
    width: 100%;
    height: auto;
    border-radius: 10px;
    display: block;
    transition: transform 0.2s ease;
  }
  .menu-link:active .menu-img { transform: scale(0.98); }

  .menu-zoom-hint {
    position: absolute;
    left: 0.6rem;
    bottom: 0.6rem;
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: rgba(42,32,19,0.75);
    color: #fff;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.35rem 0.6rem;
    border-radius: 999px;
    backdrop-filter: blur(2px);
  }
  .menu-zoom-hint svg { width: 13px; height: 13px; }

  /* ---------- LIGHTBOX ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(10,8,4,0.94);
    z-index: 999;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.open { display: flex; }

  .lightbox-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: pan-y;
    overflow: hidden;
  }
  .lightbox-stage img {
    max-width: 92vw;
    max-height: 78vh;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    user-select: none;
    -webkit-user-drag: none;
  }

  .lightbox-close {
    position: absolute;
    top: 1rem;
    left: 1rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .lightbox-close svg { width: 18px; height: 18px; }

  .lightbox-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .lightbox-nav svg { width: 20px; height: 20px; }
  .lightbox-nav.prev { right: 0.8rem; }
  .lightbox-nav.next { left: 0.8rem; }

  .lightbox-dots {
    display: flex;
    gap: 8px;
    padding-bottom: 1.4rem;
  }
  .lightbox-dots .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
  }
  .lightbox-dots .dot.active { background: #fff; }

  .lightbox-hint {
    position: absolute;
    bottom: 0.4rem;
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 0.72rem;
  }

  /* ---------- FOOTER ---------- */
  footer {
    margin-top: 2.4rem;
    text-align: center;
    color: var(--ink-mute);
    font-size: 0.78rem;
  }
  footer .dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 0.7rem;
  }
  footer .dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  footer .dots span:nth-child(1) { background: var(--green); }
  footer .dots span:nth-child(2) { background: var(--gold); }
  footer .dots span:nth-child(3) { background: var(--red); }

  @media (max-width: 360px) {
    .tagline { font-size: 0.92rem; }
  }
</style>
</head>
<body>

  <div class="hero">
    <div class="hero-inner">
      <img src="logo.jpg" alt="أبو حلاوة - ملك السعادة" class="logo">
      <h1 class="sr-only">أبو حلاوة</h1>
      <p class="tagline">بيتزا · كريب · مكرونة · فطائر</p>
    </div>
    <div class="wave">
      <svg viewBox="0 0 500 42" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,18 C60,40 120,0 180,18 C240,36 300,4 360,18 C410,29 460,9 500,20 L500,42 L0,42 Z" fill="#fbf8f1"/>
      </svg>
    </div>
  </div>

  <div class="wrap">

    <!-- FACEBOOK -->
    <section>
      <a href="https://www.facebook.com/" target="_blank" class="fb-btn">
        <span class="icon-circle">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 21v-7.5H16l.5-3.5h-3V7.7c0-1 .3-1.7 1.7-1.7H16.6V2.8C16.3 2.8 15.3 2.7 14.1 2.7c-2.5 0-4.2 1.5-4.2 4.3v2H7.4v3.5H10V21h3.5z"/></svg>
        </span>
        <span class="fb-text">
          <div class="fb-title">تابعنا على فيسبوك</div>
          <div class="fb-sub">آخر العروض والأصناف الجديدة</div>
        </span>
        <span class="fb-chevron">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </span>
      </a>
    </section>

    <!-- MENU -->
    <section>
      <h2 class="section-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16"/><path d="M4 4c4 0 4 3 8 3s4-3 8-3"/><path d="M4 12c4 0 4 3 8 3s4-3 8-3"/></svg>
        المنيو
      </h2>

      <div class="menu-card">
        <button type="button" class="menu-link" onclick="openLightbox(0)">
          <img src="MenuFront.jpeg" alt="المنيو - الصفحة الأولى" class="menu-img">
          <span class="menu-zoom-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            اضغط للتكبير
          </span>
        </button>
      </div>

      <div class="menu-card">
        <button type="button" class="menu-link" onclick="openLightbox(1)">
          <img src="MenuBack.jpeg" alt="المنيو - الصفحة الثانية" class="menu-img">
          <span class="menu-zoom-hint">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            اضغط للتكبير
          </span>
        </button>
      </div>
    </section>

    <footer>
      <div class="dots"><span></span><span></span><span></span></div>
      أبو حلاوة · ملك السعادة
    </footer>

  </div>

  <!-- LIGHTBOX (opens in-page, swipeable, no new tab) -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lightbox-nav prev" onclick="navLightbox(-1)" aria-label="السابق">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="lightbox-stage" id="lightboxStage">
      <img id="lightboxImg" src="" alt="">
      <span class="lightbox-hint">مرر يميناً أو يساراً للتنقل</span>
    </div>
    <button class="lightbox-nav next" onclick="navLightbox(1)" aria-label="التالي">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <div class="lightbox-dots" id="lightboxDots">
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </div>

<script>
  var menuImages = [
    { src: 'MenuFront.jpeg', alt: 'المنيو - الصفحة الأولى' },
    { src: 'MenuBack.jpeg', alt: 'المنيو - الصفحة الثانية' }
  ];
  var currentIndex = 0;
  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxStage = document.getElementById('lightboxStage');
  var dots = document.querySelectorAll('#lightboxDots .dot');

  function updateLightbox() {
    lightboxImg.src = menuImages[currentIndex].src;
    lightboxImg.alt = menuImages[currentIndex].alt;
    dots.forEach(function (d, i) {
      d.classList.toggle('active', i === currentIndex);
    });
  }

  function openLightbox(i) {
    currentIndex = i;
    updateLightbox();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  function navLightbox(dir) {
    currentIndex = (currentIndex + dir + menuImages.length) % menuImages.length;
    updateLightbox();
  }

  // close on tapping the dark backdrop (but not the image itself)
  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox || e.target === lightboxStage) closeLightbox();
  });

  // swipe support
  var touchStartX = 0;
  var touchStartY = 0;
  lightboxStage.addEventListener('touchstart', function (e) {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  lightboxStage.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].screenX - touchStartX;
    var dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
      navLightbox(dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  // keyboard support
  document.addEventListener('keydown', function (e) {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') navLightbox(-1);
    if (e.key === 'ArrowLeft') navLightbox(1);
  });
</script>

</body>
</html>
